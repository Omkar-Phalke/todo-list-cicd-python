
name: Python To-Do CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: todo-list-python:latest

  test:
    name: Test Python application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v
        env:
          PYTHONPATH: .

  deploy:
    name: Deploy container (runner demonstration)
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t todo-list-python:latest .

      - name: Run Docker container
        run: |
          docker run -d \
            --name todo-list-container \
            -p 5000:5000 \
            todo-list-python:latest

      - name: Wait for application
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Application health check failed"
          docker logs todo-list-container
          exit 1

      - name: Verify application
        run: |
          curl --fail http://localhost:5000/
          curl --fail http://localhost:5000/health

      - name: Stop and remove container
        if: always()
        run: |
          docker rm -f todo-list-container || true
