name: Python To-Do CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: todo-list-python:ci

  test:
    name: Test Python application
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run automated tests
        run: pytest -v

  deploy:
    name: Deploy container (runner demonstration)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Docker image for deployment
        run: docker build -t todo-list-python:ci .
      - name: Run container
        run: |
          docker run -d --name todo-list-app -p 5000:5000 todo-list-python:ci
          for attempt in $(seq 1 15); do
            if curl --fail http://127.0.0.1:5000/health; then
              echo "Container health check passed."
              exit 0
            fi
            sleep 2
          done
          docker logs todo-list-app
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f todo-list-app || true
